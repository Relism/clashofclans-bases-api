<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clash of Clans Base Fetcher API</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <style>
      body {
        font-family: "Arial", sans-serif;
        background-color: #f8f9fa;
      }

      .card-body {
        padding: 2rem;
      }

      .form-control {
        border-radius: 0.375rem;
      }

      .btn-primary {
        border-radius: 0.375rem;
      }

      .result-card img {
        max-width: 100%;
        height: auto;
        border-top-left-radius: 1rem;
        border-top-right-radius: 1rem;
      }

      .result-card .card-title {
        font-size: 1.25rem;
        font-weight: bold;
      }

      .result-card .card-text {
        font-size: 0.875rem;
      }

      .card-deck {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        justify-items: center;
        margin-top: 20px;
      }

      .card {
        border-radius: 1rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .btn-outline-primary {
        font-size: 0.875rem;
        padding: 0.5rem 1rem;
      }

      .btn-success {
        font-size: 1.125rem;
        padding: 0.75rem 1.5rem;
      }

      /* Loading spinner */
      .spinner-container {
        display: none;
        text-align: center;
        margin-top: 20px;
      }

      .spinner-border {
        width: 3rem;
        height: 3rem;
        border-width: 0.3rem;
        color: #007bff;
      }
    </style>
  </head>

  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Clash of Clans Base Fetcher API</h1>
      <p class="text-center mb-4">
        Find Clash of Clans base layouts with options to filter or get a random
        base.
      </p>

      <form id="baseFilterForm" class="mb-4">
        <div class="card rounded-lg">
          <div class="card-body">
            <h5 class="card-title">Filter Base Layouts</h5>

            <div class="mb-3">
              <label for="level" class="form-label">Townhall Level:</label>
              <input
                type="number"
                id="level"
                name="level"
                class="form-control"
                required
                min="1"
                max="17"
                placeholder="Enter Townhall level (1-17)"
              />
            </div>

            <div class="mb-3">
              <label for="type" class="form-label"
                >Type of Base (Optional):</label
              >
              <select id="type" name="type" class="form-control">
                <option value="">All</option>
                <option value="war">War</option>
                <option value="farm">Farm</option>
                <option value="defence">Defence</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="limit" class="form-label"
                >Limit Number of Bases:</label
              >
              <input
                type="number"
                id="limit"
                name="limit"
                class="form-control"
                min="1"
                max="100"
                placeholder=""
              />
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Fetch Bases
            </button>
          </div>
        </div>
      </form>

      <div class="text-center toggle-btns">
        <button id="getRandomBaseBtn" class="btn btn-success">
          Get a Random Base
        </button>
      </div>

      <div id="spinner" class="spinner-container">
        <div class="spinner-border" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>

      <div class="card-deck" id="baseResults"></div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ka2Exbcdjq4HnntNbgknZK8QKzPt3L6M0GTkwU3tbFUH9drAf3w1mV/q1vOfcQ8I"
      crossorigin="anonymous"
    ></script>

    <script>
      const maxRetries = 10;

      function showLoading() {
        document.getElementById("spinner").style.display = "block";
      }

      function hideLoading() {
        document.getElementById("spinner").style.display = "none";
      }

      async function fetchWithRetry(url, tries = 0) {
        try {
          const response = await fetch(url);
          if (response.status === 404) {
            if (tries < maxRetries) {
              console.log(`Retrying... Attempt ${tries + 1}`);
              return fetchWithRetry(url, tries + 1);
            } else {
              throw new Error("Max retries reached.");
            }
          }
          return await response.json();
        } catch (error) {
          console.error("Error fetching data:", error);
          alert("Failed to fetch data.");
        }
      }

      document
        .getElementById("baseFilterForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const level = document.getElementById("level").value;
          const type = document.getElementById("type").value;
          const limit = document.getElementById("limit").value;

          const url = `/getBases?level=${level}&type=${type}&limit=${limit}`;

          showLoading(); // Show loading spinner

          try {
            const data = await fetchWithRetry(url);
            const baseResults = document.getElementById("baseResults");
            baseResults.innerHTML = "";

            if (data.data && data.data.length > 0) {
              data.data.forEach((base) => {
                const baseCard = ` 
                <div class="card result-card" style="width: 18rem;">
                    <img src="${base.image}" class="card-img-top" alt="Base Image">
                    <div class="card-body">
                        <h5 class="card-title">${base.title}</h5>
                        <a href="${base.baseLink}" class="btn btn-outline-primary" target="_blank">Base Link</a>
                    </div>
                </div>
              `;
                baseResults.innerHTML += baseCard;
              });
            } else {
              baseResults.innerHTML = `<p class="text-center">No bases found based on your filters.</p>`;
            }
          } catch (error) {
            console.error("Error fetching bases:", error);
          } finally {
            hideLoading();
          }
        });

      document
        .getElementById("getRandomBaseBtn")
        .addEventListener("click", async function () {
          const level = document.getElementById("level").value;
          const type = document.getElementById("type").value;

          const randomLevel = level
            ? level
            : Math.floor(Math.random() * 17) + 1;

          const url = `/getRandomBase?level=${randomLevel}&type=${type}`;

          showLoading();

          try {
            const data = await fetchWithRetry(url);
            const baseResults = document.getElementById("baseResults");
            baseResults.innerHTML = "";

            if (data) {
              const baseCard = ` 
              <div class="card result-card" style="width: 18rem;">
                  <img src="${data.image}" class="card-img-top" alt="Base Image">
                  <div class="card-body">
                      <h5 class="card-title">${data.title}</h5>
                      <a href="${data.baseLink}" class="btn btn-outline-primary" target="_blank">Base Link</a>
                  </div>
              </div>
            `;
              baseResults.innerHTML = baseCard;
            } else {
              baseResults.innerHTML = `<p class="text-center">No random base found.</p>`;
            }
          } catch (error) {
            console.error("Error fetching random base:", error);
          } finally {
            hideLoading();
          }
        });
    </script>
  </body>
  <footer class="text-center mt-4 py-3">
    <p class="mb-0">
      Made with ❤️ by
      <a href="https://github.com/Relism" target="_blank">Relism</a>
    </p>
  </footer>
</html>
